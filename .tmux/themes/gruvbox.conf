# ── Gruvbox Dark ──────────────────────────────────────────────────────────────
# bg:      #3c3836   bg_dark:  #282828   bg_hi:    #504945
# fg:      #ebdbb2   fg_dim:   #d5c4a1   fg_muted: #928374
# orange:  #fe8019   purple:   #d3869b   aqua:     #8ec07c
# green:   #b8bb26   red:      #fb4934   yellow:   #fabd2f
# border:  #504945

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-style      "fg=#d5c4a1,bg=#282828"

# Esquerda: sessão em pílula laranja + powerline right arrow
set -g status-left \
  "#[fg=#282828,bg=#fe8019,bold]  #S #[fg=#fe8019,bg=#282828,nobold]#[default] "

# Direita: caminho | powerline → hora | powerline → data
set -g status-right \
  "#[fg=#928374]  #{=/28/…:#{s|$HOME|~|:pane_current_path}} "\
"#[fg=#504945,bg=#282828]#[fg=#d5c4a1,bg=#504945]  %H:%M "\
"#[fg=#fe8019,bg=#504945]#[fg=#282828,bg=#fe8019,bold]  %d %b "

# ── Janelas ───────────────────────────────────────────────────────────────────
# Inativa: discreta com indicador de última janela visitada
set -g window-status-style  "fg=#928374,bg=#282828"
set -g window-status-format \
  " #[fg=#504945]#{?window_last_flag,›,·}#[fg=#928374] #I #W "

# Ativa: fundo destacado, número em laranja, nome em branco
set -g window-status-current-style  "fg=#ebdbb2,bg=#3c3836,bold"
set -g window-status-current-format " #[fg=#fe8019]#I #[fg=#ebdbb2]#W "

# Atividade / alarme
set -g window-status-activity-style "fg=#fabd2f,bg=#282828"
set -g window-status-bell-style     "fg=#fb4934,bg=#282828,bold"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#504945"
set -g pane-active-border-style "fg=#fe8019"

# ── Mensagens e modo de cópia ─────────────────────────────────────────────────
set -g message-style         "fg=#fe8019,bg=#282828"
set -g message-command-style "fg=#d3869b,bg=#282828,bold"
set -g mode-style            "fg=#282828,bg=#fe8019"

# ── Tokyo Night Storm ─────────────────────────────────────────────────────────
# bg:      #24283b   bg_dark:  #1f2335   bg_hi:    #2d3248
# fg:      #c0caf5   fg_dim:   #a9b1d6   fg_muted: #565f89
# blue:    #7aa2f7   purple:   #bb9af7   cyan:     #7dcfff
# green:   #9ece6a   red:      #f7768e   yellow:   #e0af68
# border:  #3b4261

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-style      "fg=#a9b1d6,bg=#1f2335"

# Esquerda: sessão em pílula azul + powerline right arrow
set -g status-left \
  "#[fg=#1f2335,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1f2335,nobold]#[default] "

# Direita: caminho | powerline → hora | powerline → data
set -g status-right \
  "#[fg=#565f89]  #{=/28/…:#{s|$HOME|~|:pane_current_path}} "\
"#[fg=#3b4261,bg=#1f2335]#[fg=#a9b1d6,bg=#3b4261]  %H:%M "\
"#[fg=#7aa2f7,bg=#3b4261]#[fg=#1f2335,bg=#7aa2f7,bold]  %d %b "

# ── Janelas ───────────────────────────────────────────────────────────────────
# Inativa: discreta com indicador de última janela visitada
set -g window-status-style  "fg=#565f89,bg=#1f2335"
set -g window-status-format \
  " #[fg=#3b4261]#{?window_last_flag,›,·}#[fg=#565f89] #I #W "

# Ativa: fundo destacado, número em azul, nome em branco
set -g window-status-current-style  "fg=#c0caf5,bg=#24283b,bold"
set -g window-status-current-format " #[fg=#7aa2f7]#I #[fg=#c0caf5]#W "

# Atividade / alarme
set -g window-status-activity-style "fg=#e0af68,bg=#1f2335"
set -g window-status-bell-style     "fg=#f7768e,bg=#1f2335,bold"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# ── Mensagens e modo de cópia ─────────────────────────────────────────────────
set -g message-style         "fg=#7aa2f7,bg=#1f2335"
set -g message-command-style "fg=#bb9af7,bg=#1f2335,bold"
set -g mode-style            "fg=#1f2335,bg=#7aa2f7"

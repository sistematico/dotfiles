# Pi
set -g extended-keys on
set -g extended-keys-format csi-u

# ── Terminal / True Color (Kitty) ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-features ",xterm*:RGB"

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 30000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# ── Keybindings ───────────────────────────────────────────────────────────────
bind-key K kill-server
bind-key k kill-session
bind-key x kill-pane
bind-key R source-file ~/.tmux.conf \; display ' Config reloaded!'
bind-key -n C-PageUp   previous-window
bind-key -n C-PageDown next-window

# Better wheel behavior inside tmux panes and copy long selections to Wayland clipboard
bind -n WheelUpPane   if -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane if -F "#{pane_in_mode}" "send-keys -M" "send-keys -M"
# shift+scroll passa para o Kitty tratar (estender seleção nativa do terminal)
bind -n S-WheelUpPane   send-keys -M
bind -n S-WheelDownPane send-keys -M
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

# ── Tokyo Night Storm ─────────────────────────────────────────────────────────
# bg:      #24283b   bg_dark:  #1f2335   bg_hi:    #2d3248
# fg:      #c0caf5   fg_dim:   #a9b1d6   fg_muted: #565f89
# blue:    #7aa2f7   purple:   #bb9af7   cyan:     #7dcfff
# green:   #9ece6a   red:      #f7768e   yellow:   #e0af68
# border:  #3b4261

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position   bottom
set -g status-interval   5
set -g status-style      "fg=#a9b1d6,bg=#1f2335"
set -g status-left-length  50
set -g status-right-length 90

# Esquerda: sessão em pílula azul + powerline right arrow
set -g status-left \
  "#[fg=#1f2335,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1f2335,nobold]#[default] "

# Direita: caminho | powerline → hora | powerline → data
set -g status-right \
  "#[fg=#565f89]  #{=/28/…:#{s|$HOME|~|:pane_current_path}} "\
"#[fg=#3b4261,bg=#1f2335]#[fg=#a9b1d6,bg=#3b4261]  %H:%M "\
"#[fg=#7aa2f7,bg=#3b4261]#[fg=#1f2335,bg=#7aa2f7,bold]  %d %b "

# ── Janelas ───────────────────────────────────────────────────────────────────
set -g window-status-separator ""

# Inativa: discreta com indicador de última janela visitada
set -g window-status-style  "fg=#565f89,bg=#1f2335"
set -g window-status-format \
  " #[fg=#3b4261]#{?window_last_flag,›,·}#[fg=#565f89] #I #W "

# Ativa: fundo destacado, número em azul, nome em branco
set -g window-status-current-style  "fg=#c0caf5,bg=#24283b,bold"
set -g window-status-current-format " #[fg=#7aa2f7]#I #[fg=#c0caf5]#W "

# Atividade / alarme
set -g window-status-activity-style "fg=#e0af68,bg=#1f2335"
set -g window-status-bell-style     "fg=#f7768e,bg=#1f2335,bold"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines        single

# ── Mensagens e modo de cópia ─────────────────────────────────────────────────
set -g message-style         "fg=#7aa2f7,bg=#1f2335"
set -g message-command-style "fg=#bb9af7,bg=#1f2335,bold"
set -g mode-style            "fg=#1f2335,bg=#7aa2f7"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'

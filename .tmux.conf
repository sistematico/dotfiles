# Pi
set -g extended-keys on
set -g extended-keys-format csi-u

# ── Terminal / True Color (Kitty) ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-features ",xterm*:RGB"

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 30000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# ── Keybindings ───────────────────────────────────────────────────────────────
bind-key K kill-server
bind-key k kill-session
bind-key x kill-pane
bind-key R source-file ~/.tmux.conf \; display ' Config reloaded!'
bind-key -n C-PageUp   previous-window
bind-key -n C-PageDown next-window

# Better wheel behavior inside tmux panes and copy long selections to Wayland clipboard
bind -n WheelUpPane   if -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane if -F "#{pane_in_mode}" "send-keys -M" "send-keys -M"
# shift+scroll passa para o Kitty tratar (estender seleção nativa do terminal)
bind -n S-WheelUpPane   send-keys -M
bind -n S-WheelDownPane send-keys -M
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

# ── Status bar (geral) ────────────────────────────────────────────────────────
set -g status-position   bottom
set -g status-interval   5
set -g status-left-length  50
set -g status-right-length 90
set -g window-status-separator ""
set -g pane-border-lines  single

# ── Tema ──────────────────────────────────────────────────────────────────────
# Alterna com prefix + T (~/dotfiles/.tmux/toggle-theme.sh)
if-shell "grep -q gruvbox $HOME/.tmux/theme 2>/dev/null" \
  "source-file ~/dotfiles/.tmux/themes/gruvbox.conf" \
  "source-file ~/dotfiles/.tmux/themes/tokyonight.conf"

bind-key T run-shell "~/dotfiles/.tmux/toggle-theme.sh"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
